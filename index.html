<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Live Event Gallery | Pro Event Gallery</title>
    <meta name="description"
        content="View and share your event photos instantly. Secure, live, and private event photo distribution.">
    <meta name="keywords" content="live event gallery, photo sharing, privacy first, instant photos">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Live Event Gallery | Instant & Private">
    <meta property="og:description"
        content="Access your event photos instantly. Secure and private face-recognition powered search.">
    <meta property="og:image"
        content="https://zqkunpevlcaoybzdtdnj.supabase.co/storage/v1/object/public/logos/og-preview.png">
    <!-- Placeholder for your brand preview -->
    <link rel="icon" type="image/png"
        href="https://zqkunpevlcaoybzdtdnj.supabase.co/storage/v1/object/public/logos/favicon.png">
    <!-- Placeholder for favicon -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wedding: {
                            gold: '#C5A059',
                            dark: 'var(--bg-main)',
                            charcoal: 'var(--bg-card)',
                            accent: 'var(--bg-accent)',
                            mainText: 'var(--text-main)',
                            mutedText: 'var(--text-muted)'
                        }
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="bg-wedding-dark min-h-screen font-body text-wedding-mainText overflow-x-hidden transition-colors duration-500">

    <!-- Header Section -->
    <header
        class="sticky top-0 z-40 bg-wedding-dark/80 backdrop-blur-md border-b border-white/5 px-4 py-4 md:py-6 shadow-2xl transition-all">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <!-- Event Title -->
            <div class="text-center flex-1">
                <h1 id="eventName"
                    class="font-display text-2xl md:text-3xl font-semibold text-wedding-gold tracking-wide">
                    Live Gallery
                </h1>
                <p id="eventDate" class="text-sm text-wedding-mutedText mt-1 font-medium"></p>
            </div>

            <!-- Refresh Button -->
            <div class="relative">
                <button id="refreshBtn"
                    class="p-3 bg-wedding-dark text-wedding-gold rounded-full hover:bg-opacity-90 transition-all duration-300 shadow-lg active:scale-90 flex items-center justify-center">
                    <svg id="refreshIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m0 0H15" />
                    </svg>
                    <!-- Pulse Indicator -->
                    <span id="newPhotoPulse" class="absolute -top-1 -right-1 flex h-4 w-4 hidden">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-wedding-gold opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-4 w-4 bg-wedding-gold"></span>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- States Container -->
        <div id="states" class="min-h-[60vh] flex items-center justify-center">

            <!-- Loading State -->
            <div id="loadingState" class="flex flex-col items-center">
                <div class="loading-spinner mb-4 w-12 h-12 border-4 border-white/5 border-t-wedding-gold rounded-full">
                </div>
                <p class="text-gray-400 font-medium italic">Finding the magic...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center max-w-sm mx-auto">
                <div class="mb-6 opacity-20">
                    <svg class="w-20 h-20 mx-auto text-wedding-gold" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <h3 class="text-xl font-semibold mb-2 text-wedding-mainText">No Photos Yet</h3>
                <p class="text-wedding-mutedText leading-relaxed font-body">Photos will appear here once the event
                    starts!
                </p>
            </div>

            <!-- Masonry Grid Container -->
            <div id="gallery" class="hidden w-full">
                <div id="galleryGrid" class="masonry-grid md:column-count-3 lg:column-count-4">
                    <!-- Photos injected by app.js -->
                </div>
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox"
        class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="relative max-w-5xl w-full h-full flex flex-col justify-center items-center">

            <!-- Close Button -->
            <button id="closeLightbox"
                class="absolute top-4 right-4 z-50 p-3 bg-black/50 text-white rounded-full hover:bg-black/70 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>

            <!-- Image Container -->
            <div class="relative w-full h-[75vh] flex items-center justify-center mb-6">
                <img id="lightboxImage" src="" alt="Full Screen Moment"
                    class="max-w-full max-h-full object-contain rounded-lg shadow-22xl">
            </div>

            <!-- Footer Controls -->
            <div class="w-full max-w-md flex items-center gap-4 px-4">
                <button id="downloadBtn"
                    class="flex-1 flex items-center justify-center gap-3 py-4 bg-wedding-gold hover:bg-wedding-gold/90 text-wedding-dark font-bold rounded-2xl transition-all shadow-lg active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>Save</span>
                </button>
                <button id="shareBtn"
                    class="flex-1 flex items-center justify-center gap-3 py-4 bg-wedding-gold/10 hover:bg-wedding-gold/20 text-wedding-gold font-bold rounded-2xl border border-wedding-gold/20 transition-all active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                    </svg>
                    <span>Share Moment</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 hidden">
        <div
            class="bg-wedding-dark text-white px-8 py-3 rounded-full shadow-2xl font-medium text-sm transition-all animate-bounce">
            <span id="toastMessage">Done!</span>
        </div>
    </div>

    <!-- AI Filter Status -->
    <div id="aiFilterStatus"
        class="fixed top-6 left-1/2 -translate-x-1/2 z-40 bg-wedding-dark/90 backdrop-blur-xl border border-wedding-gold/30 px-6 py-3 rounded-full shadow-2xl flex items-center gap-4 hidden">
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
                <span
                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-wedding-gold opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-wedding-gold"></span>
            </span>
            <span class="text-sm font-bold text-white font-display">Showing Your Photos</span>
        </div>
        <div class="w-px h-4 bg-white/10"></div>
        <button id="clearAiFilterBtn"
            class="text-xs font-bold text-wedding-gold hover:text-white transition-colors uppercase tracking-widest">Clear</button>
    </div>

    <!-- AI Searching Progress Bar -->
    <div id="aiSearchingBar" class="fixed top-0 left-0 right-0 z-[80] hidden">
        <div class="bg-wedding-dark/95 backdrop-blur-xl border-b border-wedding-gold/20 px-6 py-4 shadow-2xl">
            <div class="max-w-md mx-auto flex items-center gap-4">
                <div class="relative flex h-5 w-5 flex-shrink-0">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-wedding-gold opacity-60"></span>
                    <span class="relative inline-flex items-center justify-center rounded-full h-5 w-5 bg-wedding-gold">
                        <svg class="w-3 h-3 text-wedding-dark animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                    </span>
                </div>
                <div class="flex-1">
                    <p id="aiSearchingText" class="text-sm font-bold text-white font-display">✨ Searching for your
                        photos...</p>
                    <div class="mt-2 h-1 bg-white/10 rounded-full overflow-hidden">
                        <div id="aiSearchingProgress"
                            class="h-full bg-wedding-gold rounded-full transition-all duration-500" style="width: 0%">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Find Me Button -->
    <div class="fixed bottom-8 left-6 z-[60]">
        <button id="findMeBtn"
            class="group flex items-center justify-center gap-3 p-5 bg-wedding-dark/90 backdrop-blur-xl text-wedding-gold rounded-full shadow-[0_8px_32px_rgba(0,0,0,0.5)] border border-wedding-gold/30 hover:scale-110 active:scale-95 transition-all cursor-pointer">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span
                class="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-300 font-bold text-sm whitespace-nowrap">Find
                My Photos</span>
        </button>
    </div>

    <!-- AI Selfie Modal -->
    <div id="selfieModal" class="fixed inset-0 z-[100] bg-black/95 items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm flex flex-col items-center gap-6">
            <div class="text-center">
                <h3 class="text-2xl font-display font-bold text-white mb-2">✨ Find Your Moments</h3>
                <p class="text-gray-400 text-sm">Take a selfie and AI will find you in the gallery.</p>
            </div>
            <div
                class="relative w-full aspect-square rounded-3xl overflow-hidden border-2 border-wedding-gold shadow-[0_0_30px_rgba(197,160,89,0.2)]">
                <video id="selfieVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 border-[30px] border-black/20 rounded-3xl pointer-events-none"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-48 h-64 border-2 border-dashed border-wedding-gold/50 rounded-[100px]"></div>
                </div>
            </div>
            <div class="flex gap-4 w-full">
                <button id="closeSelfieBtn"
                    class="flex-1 py-4 text-gray-500 font-bold hover:text-white transition-colors">Cancel</button>
                <div class="flex flex-col gap-3 flex-[2]">
                    <button id="captureSelfieBtn"
                        class="w-full py-4 bg-wedding-gold text-wedding-dark font-bold rounded-xl shadow-lg hover:bg-white transition-all active:scale-95">
                        Take Selfie
                    </button>
                    <div class="flex items-center gap-4 w-full">
                        <div class="h-px flex-1 bg-white/10"></div>
                        <span class="text-[10px] text-gray-500 font-bold uppercase tracking-tighter">OR</span>
                        <div class="h-px flex-1 bg-white/10"></div>
                    </div>
                    <button id="uploadSelfieBtn"
                        class="w-full py-3 bg-white/5 text-gray-300 font-bold rounded-xl border border-white/10 hover:bg-white/10 transition-all active:scale-95">
                        Upload Photo
                    </button>
                    <input type="file" id="selfieFileInput" accept="image/*" class="hidden">
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>

</html>
```
